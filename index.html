<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pomidor</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <button id="button-settings">⚙</button>
    <div class="background">
        <div class="pomodoro-wrapper">

            <img src="assets/test.png" id="pomodoro-image" alt="Pomidor">

            <div class="timer-panel">
                <h2 id="mode-display">Pomodoro</h2>
                <h1 id="timer-display">45:00</h1>
            </div>

            <div class="button-group">
                    <button id="button-toggle">Start</button>
                    <button id="button-end">Zakończ sesję</button>
                </div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <button id="button-close-settings" class="close-btn">&times;</button>
        
        <h3>Time settings</h3>

        <div class="setting-row">
            <label for="work-input">Work time (min):</label>
            <input type="number" id="work-input" value="45" min="1">
        </div>
        <div class="setting-row">
            <label for="break-input">Break time (min):</label>
            <input type="number" id="break-input" value="5" min="1">
        </div>
        <div class="setting-row">
            <label for="long-break-input">Long break time (min):</label>
            <input type="number" id="long-break-input" value="10" min="1">
        </div>

        <button id="button-save-settings">Set times</button>
    </div>

    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
